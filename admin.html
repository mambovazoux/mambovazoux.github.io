<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:15px}.box{background:#111;padding:15px;border-radius:10px}input,textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#222;color:#fff}button{width:100%;padding:12px;background:#ff0040;border:none;border-radius:8px;color:#fff;font-weight:bold}</style>
</head><body>
<h2 style="color:#ff0040;text-align:center">ADMIN MAMBO VAZOUX</h2>
<div class="box">
<input id="t" placeholder="Título do vídeo - ex: Morena de Luanda">
<input id="thumb" placeholder="Link da imagem (thumbnail) - ex: https://picsum.photos/300/170">
<input id="video" placeholder="Link do vídeo - ex: https://...mp4 ou https://dood...">
<textarea id="desc" placeholder="Descrição do video"></textarea>
<button onclick="salvar()">💾 SALVAR VÍDEO</button>
<p id="msg" style="font-size:12px;color:#0f0"></p>
</div>
<div class="box" style="margin-top:10px"><b>Vídeos salvos:</b><div id="lista">Carregando...</div></div>
<script>
const URL="https://uykukakwsdsyfyigbzzs.supabase.co"; const KEY="sb_publishable_FhTK3M2IdoGdmK0gWMT9iQ__7tE6j4Z";
async function salvar(){
 const title=document.getElementById('t').value; const thumbnail_url=document.getElementById('thumb').value; const video_url=document.getElementById('video').value; const description=document.getElementById('desc').value;
 if(!title||!video_url) return alert('Título e Link do vídeo obrigatório');
 document.getElementById('msg').innerText='Salvando...';
 const r=await fetch(`${URL}/rest/v1/videos`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({title,thumbnail_url,video_url,description,category:'Angola'})});
 if(r.ok){document.getElementById('msg').innerText='✅ Vídeo salvo com sucesso!'; load();} else {const e=await r.text(); alert('Erro: '+e)}
}
async function load(){
 const r=await fetch(`${URL}/rest/v1/videos?select=*&order=created_at.desc`,{headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}});
 const d=await r.json(); document.getElementById('lista').innerHTML=d.map(v=>`<div style="padding:5px 0;border-bottom:1px solid #222">${v.title} <span style="color:red;cursor:pointer" onclick="del('${v.id}')"> [apagar]</span></div>`).join('')||'Nenhum vídeo ainda';
}
async function del(id){ if(!confirm('Apagar?')) return; await fetch(`${URL}/rest/v1/videos?id=eq.${id}`,{method:'DELETE',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`}}); load(); }
load();
</script>
</body></html>
