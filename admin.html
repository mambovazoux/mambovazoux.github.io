<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Mambo Vazoux</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;padding:20px;background:#f5f5f5;max-width:600px;margin:0 auto}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px}button{padding:12px 20px;background:#000;color:#fff;border:none;border-radius:6px;width:100%}#painel{display:none}</style>
</head>
<body>
<div id="login">
<h2>Admin Mambo Vazoux</h2>
<input type="password" id="senha" placeholder="Digite a senha">
<button onclick="logar()">Entrar</button>
</div>

<div id="painel">
<h2>Adicionar Produto</h2>
<input id="nome" placeholder="Nome do produto">
<input id="preco" type="number" placeholder="Preço Kz">
<input id="imagem" placeholder="Link da imagem">
<textarea id="desc" placeholder="Descrição"></textarea>
<button onclick="addProduto()">Salvar Produto</button>
<p id="msg"></p>
<!-- ESPAÇO ADS ADMIN - opcional pra você ver como fica -->
<div style="margin-top:30px;background:#e0e0e0;border:2px dashed #999;height:90px;display:flex;align-items:center;justify-content:center">ESPAÇO ADS ADMIN 728x90</div>
</div>

<script>
const SUPABASE_URL = "SUA_URL_AQUI";
const SUPABASE_KEY = "SUA_KEY_AQUI";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function logar(){
  if(document.getElementById('senha').value==="946017659pd"){
    document.getElementById('login').style.display="none";
    document.getElementById('painel').style.display="block";
  } else alert("Senha errada");
}
async function addProduto(){
  const nome=document.getElementById('nome').value;
  const preco=document.getElementById('preco').value;
  const imagem_url=document.getElementById('imagem').value;
  const descricao=document.getElementById('desc').value;
  const {error}=await supabaseClient.from('produtos').insert([{nome,preco,imagem_url,descricao}]);
  if(error){document.getElementById('msg').innerText="Erro: "+error.message}
  else{document.getElementById('msg').innerText="Produto salvo!";document.getElementById('nome').value="";document.getElementById('preco').value="";document.getElementById('imagem').value="";document.getElementById('desc').value="";}
}
</script>
</body>
</html>
