<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN</title>
<style>body{background:#000;color:#fff;font-family:sans-serif;padding:15px}input{width:100%;padding:12px;margin:6px 0;border-radius:6px;background:#222;color:#fff;border:none}button{background:#ff0044;color:#fff;border:none;padding:15px;width:100%;border-radius:8px;font-size:18px}</style>
</head>
<body>
<h2 style="color:#ff0044">ADMIN MAMBO</h2>
<input id="t" placeholder="Nome: Morena de Viana">
<input id="c" placeholder="Link da capa: https://iili.io/nO71nyb.png">
<input id="v" placeholder="Link do video: buzzheavier">
<input id="d" placeholder="Descrição">
<button onclick="S()">SALVAR</button>
<div id="L"></div>
<script>
function C(){let a=JSON.parse(localStorage.getItem("mambovideos")||"[]");let h="Salvos: "+a.length+"<br>";a.forEach((x,i)=>{h+=`<div style="background:#111;margin:8px 0;padding:8px;border-radius:6px"><img src="${x.capa}" style="width:100%">${x.titulo}<br><button onclick="D(${i})">Apagar</button></div>`});document.getElementById("L").innerHTML=h}
function S(){let o={titulo:document.getElementById("t").value,capa:document.getElementById("c").value,video:document.getElementById("v").value,desc:document.getElementById("d").value,id:Date.now()};let a=JSON.parse(localStorage.getItem("mambovideos")||"[]");a.push(o);localStorage.setItem("mambovideos",JSON.stringify(a));localStorage.setItem("videos",JSON.stringify(a));alert("SALVO!");C()}
function D(i){let a=JSON.parse(localStorage.getItem("mambovideos")||"[]");a.splice(i,1);localStorage.setItem("mambovideos",JSON.stringify(a));localStorage.setItem("videos",JSON.stringify(a));C()}
C();
</script>
</body>
</html>
