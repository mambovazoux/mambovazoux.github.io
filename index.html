<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="rating" content="adult">
<title>MAMBO VAZOUX</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{padding:20px 14px;background:#111;border-bottom:2px solid #ff0044}
h1{margin:0;color:#ff0044;text-align:center;font-size:27px}
.subtitle{text-align:center;color:#aaa;margin:8px 0 16px}
main{max-width:1100px;margin:auto;padding:14px}
input{width:100%;padding:13px;border-radius:8px;border:1px solid #444;background:#191919;color:white;font-size:16px;margin-bottom:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button,.page-btn{background:#222;color:white;border:1px solid #444;padding:10px 13px;border-radius:7px;cursor:pointer}
.filters button.active,.page-btn.active{background:#ff0044;border-color:#ff0044}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#151515;border:1px solid #292929;border-radius:9px;overflow:hidden}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#222}
.card-content{padding:10px}
.card h3{font-size:14px;margin:0 0 9px;overflow-wrap:anywhere}
.watch{display:block;width:100%;background:#ff0044;color:white;text-align:center;padding:11px;border:0;border-radius:6px;text-decoration:none;font-weight:bold}
.player{display:none;background:#000;margin-top:10px}
.player iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.description{color:#bbb;font-size:12px;margin:8px 0}
#empty{text-align:center;color:#aaa;padding:30px 0;display:none}
#pagination{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:22px 0}
footer{text-align:center;color:#777;padding:22px;font-size:12px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>

<body>
<header>
<h1>MAMBO VAZOUX</h1>
<div class="subtitle">Conteúdo para adultos · 18+</div>
</header>

<main>
<input id="search" placeholder="Pesquisar vídeos..." autocomplete="off">

<div class="filters">
<button class="active" data-filter="all">Todos</button>
<button data-filter="new">Novos</button>
<button data-filter="fav">☆ Favoritos</button>
</div>

<div class="grid" id="grid"></div>
<div id="empty">Nenhum vídeo encontrado.</div>
<div id="pagination"></div>
</main>

<footer>18+ · Acede apenas a conteúdo que tens autorização para visualizar.</footer>

<script>
const VIDEOS_PER_PAGE=6;

const videos=[
{
 title:"Vídeo de teste",
 thumbnail:"https://strm9.uqload.vc/i/03/06033/j046v8p2e9ty_t.jpg",
 url:"https://uqload.vc/embed-j046v8p2e9ty.html",
 description:"Vídeo de teste do Mambo Vazoux."
}
];

let currentPage=1;
let currentFilter="all";
let query="";
let favorites=JSON.parse(localStorage.getItem("mv_favorites")||"[]");

function getVideos(){
 let list=videos.filter(v=>v.title.toLowerCase().includes(query));
 if(currentFilter==="fav") list=list.filter(v=>favorites.includes(v.url));
 if(currentFilter==="new") list=list.slice().reverse();
 return list;
}

function render(){
 const list=getVideos();
 const totalPages=Math.max(1,Math.ceil(list.length/VIDEOS_PER_PAGE));
 currentPage=Math.min(currentPage,totalPages);
 const start=(currentPage-1)*VIDEOS_PER_PAGE;
 const visible=list.slice(start,start+VIDEOS_PER_PAGE);

 document.getElementById("grid").innerHTML=visible.map(v=>`
 <article class="card">
   <img class="thumb" src="${escapeHTML(v.thumbnail)}" alt=""
        loading="lazy" onerror="this.style.display='none'">
   <div class="card-content">
     <h3>${escapeHTML(v.title)}</h3>
     <p class="description">${escapeHTML(v.description||"")}</p>
     <button class="watch" onclick="playVideo(this, '${encodeURIComponent(v.url)}')">▶ Assistir</button>
     <button class="watch" style="margin-top:6px;background:#292929"
       onclick="toggleFavorite('${encodeURIComponent(v.url)}')">
       ${favorites.includes(v.url)?"★ Favorito":"☆ Favoritar"}
     </button>
     <div class="player"></div>
   </div>
 </article>`).join("");

 document.getElementById("empty").style.display=list.length?"none":"block";

 document.getElementById("pagination").innerHTML=Array.from({length:totalPages},(_,i)=>
 `<button class="page-btn ${currentPage===i+1?"active":""}" onclick="goPage(${i+1})">${i+1}</button>`
 ).join("");
}

function playVideo(button,encodedUrl){
 const url=decodeURIComponent(encodedUrl);
 const player=button.parentElement.querySelector(".player");
 document.querySelectorAll(".player").forEach(p=>{
   if(p!==player){p.style.display="none";p.innerHTML=""}
 });
 if(player.style.display==="block"){
   player.style.display="none";player.innerHTML="";return;
 }
 player.innerHTML=`<iframe src="${escapeHTML(url)}" title="Leitor de vídeo" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
 player.style.display="block";
}

function toggleFavorite(encodedUrl){
 const url=decodeURIComponent(encodedUrl);
 favorites=favorites.includes(url)?favorites.filter(x=>x!==url):[...favorites,url];
 localStorage.setItem("mv_favorites",JSON.stringify(favorites));
 render();
}

function goPage(page){currentPage=page;render();window.scrollTo({top:0,behavior:"smooth"})}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

document.getElementById("search").addEventListener("input",e=>{
 query=e.target.value.toLowerCase().trim();currentPage=1;render();
});

document.querySelectorAll(".filters button").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  currentFilter=button.dataset.filter;currentPage=1;render();
 });
});

render();
</script>
</body>
</html>
