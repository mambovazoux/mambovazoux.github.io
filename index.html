<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAMBO VAZOUX</title>
<style>
body{background:#000;color:#fff;margin:0;font-family:Arial}
.header{background:#111;padding:10px;display:flex;align-items:center;justify-content:space-between}
.logo{color:#ff0044;font-weight:bold;font-size:22px}
.search{background:#222;border:none;padding:8px 12px;border-radius:20px;color:#fff}
.card{background:#111;margin:10px;border-radius:10px;overflow:hidden}
.thumb{position:relative;cursor:pointer}
.thumb img{width:100%;display:block}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,0,68,0.85);width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.info{padding:10px}
.btn{width:100%;background:#ff0044;color:#fff;border:none;padding:12px;border-radius:6px;font-weight:bold;margin-top:8px}
#modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
</style>
</head>
<body>

<div class="header">
<div class="logo">MAMBO VAZOUX ✅<br><small style="font-size:10px;background:#00c853;padding:2px 6px;border-radius:4px">VERIFICADO 18+ RTA 2257 SSL</small></div>
<input class="search" placeholder="Pesquisar...">
</div>

<div class="card">
<div class="thumb" onclick="play('https://buzzheavier.com/8nuvk8gybigr')">
<img src="https://i.imgur.com/8Km9tLL.jpg">
<div class="play">▶</div>
</div>
<div class="info">
<b>MORENA GOSTOSA - VIDEO COMPLETO</b><br>
<span style="color:#aaa;font-size:13px">Conteúdo exclusivo 18+ Verificado</span>
<button class="btn" onclick="play('https://buzzheavier.com/8nuvk8gybigr')">▶ VER VÍDEO</button>
</div>
</div>

<button style="width:95%;margin:10px;background:#ff0044;border:none;color:#fff;padding:14px;border-radius:25px;font-weight:bold;display:block">NEXT → Próxima Página</button>

<div id="modal" onclick="closeM()">
<div style="width:95%;max-width:500px" onclick="event.stopPropagation()">
<video id="vid" controls playsinline style="width:100%;border-radius:10px;background:#000"></video>
<button onclick="closeM()" style="width:100%;margin-top:10px;background:#333;color:#fff;border:none;padding:12px;border-radius:6px">✕ FECHAR</button>
</div>
</div>

<script>
function play(link){
 document.getElementById('vid').src=link;
 document.getElementById('modal').classList.add('show');
 document.getElementById('vid').play();
}
function closeM(){
 document.getElementById('modal').classList.remove('show');
 document.getElementById('vid').pause();
}
</script>

<div style="text-align:center;padding:20px;font-size:11px;color:#666">
✅ VERIFICADO 18+ RTA • Restricted To Adults 2257 COMPLIANT<br>
18 U.S.C §2257 - Todos modelos com 18+ verificados<br>
© 2026 Mambo Vazoux Angola - Site Verificado
</div>

</body>
</html>
